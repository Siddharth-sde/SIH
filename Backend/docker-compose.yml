version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_backend_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount current directory for hot-reloading code and persistent SQLite DB
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload