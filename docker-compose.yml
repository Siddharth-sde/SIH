version: '3.8'

services:
  # Container 1: Ollama LLM Engine (GPU Passthrough)
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: sih_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - "label=disable"

  # Container 2: ML Harmonization Microservice
  ml-service:
    build:
      context: ./ML
      dockerfile: Dockerfile.ml
    container_name: sih_ml_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b
      - SAVINGS_PERCENTAGE=0.08
      - HF_HUB_OFFLINE=1
    depends_on:
      - ollama

  # Container 3: Unified App Host (Backend Gateway + Frontend Web Server)
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: sih_app_host
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - DATABASE_URL=sqlite:///./material_master.db
      - PYTHONUNBUFFERED=1
    volumes:
      - sih-data:/app/data
    depends_on:
      - ml-service

volumes:
  ollama-storage:
  sih-data:
